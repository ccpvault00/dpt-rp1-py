[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpt-rp1-py"
version = "0.1.17"
description = "Python package to manage a Sony DPT-RP1"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "httpsig>=1.1.2",
    "requests>=2.18.4",
    "pbkdf2>=1.3",
    "urllib3>=1.22",
    "pyyaml",
    "anytree",
    "zeroconf>=0.29.0",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "ruff>=0.4.0",
]

[project.scripts]
dptrp1 = "dptrp1.cli.dptrp1:main"
dptmount = "dptrp1.cli.dptmount:main"

[tool.ruff]
line-length = 200
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
